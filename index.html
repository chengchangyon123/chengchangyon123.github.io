<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DesignerAI - 室内建筑景观设计智能体</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-bg: #0a0e17;
            --secondary-bg: #121a29;
            --accent-blue: #2563eb;
            --light-blue: #60a5fa;
            --border-color: #1e3a5f;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --glow: 0 0 15px rgba(59, 130, 246, 0.5);
            --card-hover-glow: 0 0 20px rgba(96, 165, 250, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
            background-image: 
                radial-gradient(circle at 70% 90%, rgba(59, 130, 246, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 30% 10%, rgba(59, 130, 246, 0.05) 0%, transparent 30%);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes scaleHover {
            0% { transform: scale(1); }
            100% { transform: scale(1.02); }
        }

        .page {
            display: none;
            width: 100%;
            height: 100%;
            animation: fadeIn 0.3s ease;
        }
        .page.active {
            display: flex;
        }

        .card-hover {
            transition: all 0.3s ease;
        }
        .card-hover:hover {
            box-shadow: var(--card-hover-glow);
            animation: scaleHover 0.3s forwards;
            border-color: var(--light-blue);
        }

        .app-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .top-nav {
            height: 50px;
            background-color: rgba(18, 26, 41, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 99;
        }
        .nav-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .app-title {
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(90deg, var(--light-blue), #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .nav-right {
            display: flex;
            align-items: center;
            gap: 24px;
        }
        .nav-link {
            color: var(--text-secondary);
            font-size: 14px;
            cursor: pointer;
            transition: color 0.25s;
        }
        .nav-link:hover {
            color: var(--light-blue);
        }
        .btn-primary {
            background-color: var(--accent-blue);
            padding: 6px 18px;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s;
        }
        .btn-primary:hover {
            box-shadow: var(--glow);
        }

        .sidebar {
            width: 220px;
            height: 100%;
            background-color: var(--secondary-bg);
            border-right: 1px solid var(--border-color);
            padding: 20px 0;
        }
        .sidebar-item {
            padding: 12px 24px;
            margin: 4px 12px;
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.25s;
            font-size: 14px;
        }
        .sidebar-item.active {
            background: rgba(37, 99, 235, 0.15);
            color: var(--light-blue);
            border: 1px solid var(--accent-blue);
        }
        .sidebar-item:hover:not(.active) {
            background: rgba(37, 99, 235, 0.08);
            color: #fff;
        }

        .main-wrap {
            display: flex;
            flex: 1;
        }
        .content-wrap {
            flex: 1;
            padding: 24px;
            overflow: auto;
        }

        .ui-card {
            background: var(--secondary-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
        }

        .history-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .history-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--light-blue);
        }
        .history-search {
            width: 280px;
            height: 36px;
            background: var(--secondary-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0 12px;
            color: #fff;
            outline: none;
            transition: 0.3s;
        }
        .history-search:focus {
            border-color: var(--light-blue);
            box-shadow: 0 0 8px rgba(96,165,250,0.2);
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: rgba(18,26,41,0.6);
            transition: all 0.3s ease;
        }
        .history-item:hover {
            border-color: var(--light-blue);
            box-shadow: var(--card-hover-glow);
        }
        .history-left {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .history-name {
            font-size: 15px;
            color: #fff;
        }
        .history-time {
            font-size: 12px;
            color: var(--text-secondary);
        }
        .history-type-tag {
            font-size: 12px;
            padding: 2px 10px;
            border-radius: 20px;
            background: rgba(37,99,235,0.15);
            color: var(--light-blue);
            border: 1px solid rgba(96,165,250,0.3);
        }
        .history-operate {
            display: flex;
            gap: 12px;
        }
        .history-btn {
            font-size: 13px;
            padding: 4px 12px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            cursor: pointer;
            transition: 0.3s;
        }
        .history-btn:hover {
            color: var(--light-blue);
            border-color: var(--light-blue);
        }
        .history-btn.blue {
            background: rgba(37,99,235,0.12);
            color: var(--light-blue);
            border-color: var(--accent-blue);
        }

        .flex-col-full {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="top-nav">
        <div class="nav-left">
            <i class="fa fa-angle-left back-btn"></i>
            <div class="app-title">DesignerAI 智能设计体</div>
        </div>
        <div class="nav-right">
            <div class="nav-link">帮助中心</div>
            <div class="nav-link">消息通知</div>
            <div class="btn-primary">我的积分</div>
        </div>
    </div>

    <div class="main-wrap">
        <div class="sidebar">
            <div class="sidebar-item" onclick="switchPage('page-home')">首页创作</div>
            <div class="sidebar-item" onclick="switchPage('page-edit')">图片编辑</div>
            <div class="sidebar-item" onclick="switchPage('page-material')">物料中心</div>
            <div class="sidebar-item active" onclick="switchPage('page-history')">历史记录</div>
            <div class="sidebar-item" onclick="switchPage('page-vip')">会员套餐</div>
            <div class="sidebar-item" onclick="switchPage('page-pay')">企业充值</div>
            <div class="sidebar-item" onclick="switchPage('page-user')">子账号管理</div>
        </div>

        <div class="content-wrap">
            <div id="page-home" class="page"></div>
            <div id="page-edit" class="page"></div>
            <div id="page-material" class="page"></div>

            <div id="page-history" class="page active flex-col-full">
                <div class="history-top-bar">
                    <div class="history-title">创作历史记录</div>
                    <input class="history-search" placeholder="搜索历史作品、项目名称">
                </div>
                <div class="ui-card">
                    <div class="history-list">
                        <div class="history-item">
                            <div class="history-left">
                                <div class="history-name">现代轻奢客厅全景设计方案</div>
                                <div class="history-time">2026-05-15 14:32</div>
                            </div>
                            <div class="history-type-tag">室内设计</div>
                            <div class="history-operate">
                                <div class="history-btn blue">再次生成</div>
                                <div class="history-btn">查看详情</div>
                                <div class="history-btn">删除</div>
                            </div>
                        </div>
                        <div class="history-item">
                            <div class="history-left">
                                <div class="history-name">新中式庭院景观效果图</div>
                                <div class="history-time">2026-05-14 09:16</div>
                            </div>
                            <div class="history-type-tag">景观建筑</div>
                            <div class="history-operate">
                                <div class="history-btn blue">再次生成</div>
                                <div class="history-btn">查看详情</div>
                                <div class="history-btn">删除</div>
                            </div>
                        </div>
                        <div class="history-item">
                            <div class="history-left">
                                <div class="history-name">极简办公室工装空间渲染</div>
                                <div class="history-time">2026-05-13 20:05</div>
                            </div>
                            <div class="history-type-tag">工装设计</div>
                            <div class="history-operate">
                                <div class="history-btn blue">再次生成</div>
                                <div class="history-btn">查看详情</div>
                                <div class="history-btn">删除</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="page-vip" class="page"></div>
            <div id="page-pay" class="page"></div>
            <div id="page-user" class="page"></div>
        </div>
    </div>
</div>

<script>
function switchPage(id){
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    document.querySelectorAll('.sidebar-item').forEach(item=>item.classList.remove('active'));
    event.target.classList.add('active');
}
</script>
</body>
</html>
